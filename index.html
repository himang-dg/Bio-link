    <style>
        /* ===== RESET ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== CUSTOM PROPERTIES ===== */
        :root {
            --bg: #08080d;
            --card-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.055) 0%, rgba(255, 255, 255, 0.02) 100%);
            --card-border: rgba(255, 255, 255, 0.07);
            --card-border-hover: rgba(255, 255, 255, 0.15);
            --text: #eeeef3;
            --text-dim: #7a7a92;
            --text-muted: #4a4a60;
        }

        /* ===== BASE ===== */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== ANIMATED BACKGROUND MESH ===== */
        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            will-change: transform;
        }

        .bg-blob-1 {
            width: 420px;
            height: 420px;
            background: #6366f1;
            top: -18%;
            right: -8%;
            opacity: 0.3;
            animation: blob-drift 20s ease-in-out infinite alternate;
        }

        .bg-blob-2 {
            width: 360px;
            height: 360px;
            background: #06b6d4;
            bottom: -12%;
            left: -10%;
            opacity: 0.25;
            animation: blob-drift 18s ease-in-out infinite alternate-reverse;
        }

        .bg-blob-3 {
            width: 280px;
            height: 280px;
            background: #ec4899;
            top: 45%;
            left: 55%;
            opacity: 0.15;
            animation: blob-drift 22s ease-in-out infinite alternate;
            animation-delay: -6s;
        }

        @keyframes blob-drift {
            0% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(35px, -25px) scale(1.06);
            }

            66% {
                transform: translate(-25px, 18px) scale(0.94);
            }

            100% {
                transform: translate(15px, 30px) scale(1.03);
            }
        }

        /* Subtle grid overlay */
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 64px 64px;
        }

        /* ===== CONTAINER ===== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            padding: 48px 20px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== PROFILE SECTION ===== */
        .profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 34px;
            animation: fade-in-up 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .avatar-ring {
            position: relative;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            padding: 3px;
            background: conic-gradient(from 0deg, #6366f1, #8b5cf6, #06b6d4, #10b981, #f59e0b, #ef4444, #6366f1);
        }

        .avatar-ring::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #6366f1, #8b5cf6, #06b6d4, #10b981, #f59e0b, #ef4444, #6366f1);
            filter: blur(16px);
            opacity: 0.35;
            z-index: -1;
            animation: ring-rotate 4s linear infinite;
        }

        @keyframes ring-rotate {
            to {
                filter: hue-rotate(360deg);
            }
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--bg);
            display: block;
        }

        .name-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
        }

        .name-row h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .verified {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }



        .bio {
            color: var(--text-dim);
            font-size: 0.88rem;
            margin-top: 10px;
            text-align: center;
            line-height: 1.55;
            max-width: 280px;
        }

        /* ===== LINK CARDS ===== */
        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .link-card {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            text-decoration: none;
            color: var(--text);
            cursor: pointer;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition:
                transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.35s ease,
                border-color 0.35s ease;
            opacity: 0;
            transform: translateY(18px);
            animation: card-enter 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Glass edge highlight */
        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 12%;
            right: 12%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.07), transparent);
            border-radius: 1px;
        }

        .link-card:hover {
            transform: translateY(-3px);
            border-color: var(--card-border-hover);
            box-shadow: 0 8px 32px -4px var(--glow, rgba(99, 102, 241, 0.2));
        }

        .link-card:active {
            transform: scale(0.97) translateY(-1px);
            transition-duration: 0.1s;
        }

        /* Icon container */
        .link-icon-box {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--icon-bg, rgba(99, 102, 241, 0.1));
            flex-shrink: 0;
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            color: var(--icon-color, #8b5cf6);
        }

        .link-card:hover .link-icon-box {
            transform: scale(1.08) rotate(-4deg);
        }

        .link-icon-box svg {
            width: 18px;
            height: 18px;
        }

        /* Label */
        .link-label {
            flex: 1;
            font-weight: 500;
            font-size: 0.93rem;
            letter-spacing: -0.01em;
        }

        /* Arrow indicator */
        .link-arrow {
            color: var(--text-muted);
            transition: transform 0.3s ease, color 0.3s ease;
            flex-shrink: 0;
            display: flex;
        }

        .link-arrow svg {
            width: 16px;
            height: 16px;
        }

        .link-card:hover .link-arrow {
            transform: translateX(4px);
            color: var(--text-dim);
        }

        /* ===== ANIMATIONS ===== */
        @keyframes card-enter {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== FOOTER ===== */
        footer {
            text-align: center;
            padding: 30px 0 16px;
            color: var(--text-muted);
            font-size: 0.76rem;
            letter-spacing: 0.03em;
        }

        /* ===== CUSTOM SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 640px) {
            .container {
                padding: 72px 24px 32px;
            }

            .avatar-ring {
                width: 110px;
                height: 110px;
            }

            .link-card {
                padding: 16px 20px;
            }

            .link-icon-box {
                width: 44px;
                height: 44px;
            }

            .link-icon-box svg {
                width: 20px;
                height: 20px;
            }
        }

        /* ===== REDUCED MOTION ===== */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

            play: '<polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/>',
            message: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
            shop: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>',
            heart: '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',
            mail: '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22 6 12 13 2 6"/>',
            link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
            'chevron-right': '<polyline points="9 18 15 12 9 6"/>',
        };

        // ===== HELPER: Build an SVG string =====
        function makeSvg(iconName) {
            var paths = ICONS[iconName] || ICONS.link;
            return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>';
        }

        // ===== HELPER: Hex → rgba =====
        function hexToRgba(hex, alpha) {
            var r = parseInt(hex.slice(1, 3), 16);
            var g = parseInt(hex.slice(3, 5), 16);
            var b = parseInt(hex.slice(5, 7), 16);
            return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
        }

        // ===== RENDER ALL ACTIVE LINKS =====
        function renderLinks() {
            var container = document.getElementById('links');
            var delay = 100;

            links.forEach(function (entry, index) {
                // Skip links with no URL or placeholder "/"
                if (!entry.url || entry.url === '/') return;

                // Lookup platform config, fallback to generic "link"
                var platform = PLATFORMS[entry.type] || { icon: 'link', color: '#6366f1' };

                var card = document.createElement('a');
                card.href = entry.url;
                card.target = '_blank';
                card.rel = 'noopener noreferrer';
                card.className = 'link-card';
                card.id = 'link-' + index;
                card.style.animationDelay = delay + 'ms';
                card.style.setProperty('--icon-color', platform.color);
                card.style.setProperty('--icon-bg', hexToRgba(platform.color, 0.1));
                card.style.setProperty('--glow', hexToRgba(platform.color, 0.2));

                card.innerHTML =
                    '<span class="link-icon-box">' + makeSvg(platform.icon) + '</span>' +
                    '<span class="link-label">' + entry.label + '</span>' +
                    '<span class="link-arrow">' + makeSvg('chevron-right') + '</span>';

                container.appendChild(card);
                delay += 55;
            });
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('year').textContent = new Date().getFullYear();
            renderLinks();
        });
    </script>
